<p-card header="Keyboard Shortcuts">
  <ul class="space-y-3">
    @for (shortcut of shortcuts; track shortcut.key) {
      <li class="flex items-center gap-3">
        <kbd class="bg-gray-100 px-3 py-1.5 rounded border border-gray-300 font-mono text-sm">
          {{ shortcut.key }}
        </kbd>
        <span class="text-gray-700">{{ shortcut.description }}</span>
      </li>
    }
  </ul>
</p-card>
