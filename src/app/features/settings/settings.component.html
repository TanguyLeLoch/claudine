<div class="flex h-screen">
  <p-confirmpopup/>
  <!-- Sidebar -->
  <div class="w-64 bg-gray-50 border-r border-gray-200 flex flex-col">
    <div class="p-2 flex-1">
      <h2 class="text-xl font-semibold text-gray-800 mb-4">Settings</h2>
      <p-menu [model]="menuItems" styleClass="w-full border-none"></p-menu>
    </div>
    <!-- Sidebar Footer -->
    <div class="p-4 border-t border-gray-200">
      <button pButton
              label="Exit App"
              icon="pi pi-power-off"
              class="p-button-danger p-button-text w-full justify-content-start"
              (click)="confirmExit($event)">
      </button>
    </div>
  </div>

  <!-- Content Area -->
  <div class="flex-1 overflow-auto">
    <router-outlet></router-outlet>
  </div>
</div>
