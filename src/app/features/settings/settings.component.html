<div class="h-screen bg-gray-100 text-gray-800">
  <div class="p-8 max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold mb-6">Settings</h1>

    <section class="bg-white p-6 rounded-lg shadow-md mb-6">
      <h2 class="text-2xl font-semibold mb-4">API Configuration</h2>
      <div class="mb-4">
        <label for="provider-select" class="block text-sm font-medium text-gray-700 mb-1">Provider</label>
        <select id="provider-select"
                class="block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-purple-500 focus:border-purple-500">
          <option>OpenAI</option>
          <option>Anthropic</option>
          <option>Gemini</option>
        </select>
      </div>
      <div class="mb-4">
        <label for="api-key-input" class="block text-sm font-medium text-gray-700 mb-1">API Key</label>
        <input type="password" id="api-key-input"
               class="block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-purple-500 focus:border-purple-500">
      </div>
    </section>

    <!-- Add more settings sections here as needed -->

  </div>
</div>
