<div 
  class="relative flex items-center w-full p-1.5 border rounded-md transition-colors duration-200 group"
  [ngClass]="{
    'border-primary-500 ring-2 ring-primary-100 bg-primary-50': isRecording,
    'border-gray-300 bg-white hover:border-primary-400': !isRecording && !isDisabled,
    'opacity-60 cursor-not-allowed bg-gray-100': isDisabled,
    'cursor-pointer': !isDisabled
  }"
  (click)="startRecording($event)"
>
  <div *ngIf="!value && !isRecording" class="text-gray-400 text-sm px-2 select-none">
    Click to record shortcut
  </div>

  <div *ngIf="isRecording" class="flex items-center gap-2 text-primary-600 text-sm font-medium px-2 animate-pulse select-none">
    <i class="pi pi-circle-fill text-xs"></i>
    <span>Press keys...</span>
  </div>

  <div *ngIf="value && !isRecording" class="flex flex-wrap gap-1.5 items-center">
    <ng-container *ngFor="let k of displayKeys()">
      <kbd class="
        inline-flex items-center justify-center 
        px-2 py-1 
        min-w-[24px] h-7 
        text-xs font-bold text-gray-700 
        bg-gray-100 
        border border-gray-300 border-b-2 
        rounded-md
        select-none
      ">
        {{ k }}
      </kbd>
      </ng-container>
  </div>

  <div class="ml-auto pl-2" *ngIf="value && !isDisabled">
    <p-button 
      icon="pi pi-times" 
      [text]="true" 
      [rounded]="true" 
      severity="secondary" 
      size="small"
      styleClass="w-6 h-6 !p-0 text-gray-400 hover:text-red-500"
      (onClick)="clearShortcut($event)">
    </p-button>
  </div>
</div>
