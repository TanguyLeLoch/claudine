<!-- Loading toast with custom template showing elapsed seconds, styled like PrimeNG info toast -->
<p-toast position="top-right" key="loading-toast" [baseZIndex]="5000">
  <ng-template let-message pTemplate="message">
    <div class="flex items-start gap-3" style="flex: 1">
      <!-- Info icon (matches PrimeNG info severity) -->
      <i class="pi pi-info-circle text-2xl pt-1"></i>

      <!-- Message content -->
      <div class="flex-1 flex flex-col gap-1">
        <span class="font-semibold">{{ message.summary }}</span>
        <span class="text-sm text-neutral-700">{{ message.detail }} ({{ seconds }}s)</span>
      </div>
    </div>
  </ng-template>
</p-toast>

<!-- Regular toasts (success, error, info) -->
<p-toast></p-toast>
