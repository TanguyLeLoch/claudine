<p-card class="backdrop-blur-xl bg-white/85 border border-white/40 shadow-2xl rounded-2xl p-0">
  @if (isLoading) {
    <div class="flex justify-center py-8 text-gray-400">
      <i class="pi pi-spin pi-spinner text-3xl"></i>
    </div>
  }

  @if (!isLoading) {
    <div class="flex flex-col gap-1">
      @for (shortcut of displayShortcuts; track shortcut.id; let i = $index) {

        <div
          #listItem
          (click)="onShortcutClick(shortcut, i)"
          (mouseenter)="selectedIndex = i"
          class="group flex items-center gap-3 py-1.5 px-3 cursor-pointer transition-all rounded-xl"
          [ngClass]="{
            'bg-primary-50': selectedIndex === i,
            'bg-transparent hover:bg-gray-50': selectedIndex !== i
          }"
        >

          <kbd
            class="w-6 h-6 flex items-center justify-center text-xs font-bold font-mono bg-white border border-gray-200 rounded shadow-sm text-gray-500">
            {{ i + 1 }}
          </kbd>

          <app-input-type-badge [inputType]="shortcut.inputType"></app-input-type-badge>

          <span
            class="flex-1 text-base font-medium truncate transition-colors"
            [ngClass]="{'text-primary-900': selectedIndex === i, 'text-gray-700': selectedIndex !== i}">
            {{ shortcut.name }}
          </span>

          <kbd
            class="px-2 py-1 text-xs font-bold bg-white border border-gray-200 rounded shadow-sm font-mono text-gray-500 whitespace-nowrap">
            {{ shortcut.key }}
          </kbd>

        </div>
      }

      @if (displayShortcuts.length === 0) {
        <div class="text-center py-10 text-gray-400">
          <i class="pi pi-bolt text-4xl mb-2 opacity-50"></i>
          <p>No shortcuts found</p>
        </div>
      }
    </div>
  }

  <ng-template pTemplate="footer">
    <div class="flex justify-between items-center text-xs text-gray-500 px-1 pt-2 pb-0 border-t border-black/5 select-none">
      <div class="flex gap-3">
        <div class="flex gap-1 items-center">
          <kbd class="font-mono bg-gray-100 px-1.5 py-0.5 rounded text-gray-600 border border-gray-300">↑↓</kbd>
          <span>to navigate</span>
        </div>
        <div class="flex gap-1 items-center">
          <kbd class="font-mono bg-gray-100 px-1.5 py-0.5 rounded text-gray-600 border border-gray-300">Enter</kbd>
          <span>to select</span>
        </div>
      </div>
      <button
        (click)="openSettings()"
        class="flex gap-1 items-center px-2 py-1 rounded hover:bg-gray-100 transition-colors cursor-pointer text-gray-500 hover:text-gray-700">
        <i class="pi pi-cog text-sm"></i>
        <span>Settings</span>
      </button>
    </div>
  </ng-template>

</p-card>
