<div class="p-4 max-w-3xl mx-auto">

  <p-card>
    @if (isLoading) {
      <div class="flex justify-center py-8 text-gray-400">
        <i class="pi pi-spin pi-spinner text-3xl"></i>
      </div>
    }

    @if (!isLoading) {
      <div class="flex flex-col gap-1">
        @for (shortcut of displayShortcuts; track shortcut.name; let i = $index) {

          <div
            (click)="onShortcutClick(shortcut, i)"
            (mouseenter)="selectedIndex = i"
            class="group flex items-center gap-4 py-3 px-4 cursor-pointer transition-all border-b-2"
            [ngClass]="{
              'bg-primary-50 border-primary-800': selectedIndex === i,
              'bg-white border-transparent hover:bg-gray-50': selectedIndex !== i
            }"
          >

            <kbd
              class="w-6 h-6 flex items-center justify-center text-xs font-bold font-mono bg-gray-100 border border-gray-300 rounded shadow-sm text-gray-600">
              {{ i + 1 }}
            </kbd>

            <app-input-type-badge [inputType]="shortcut.inputType"></app-input-type-badge>

            <span
              class="flex-1 text-base font-medium truncate transition-colors"
              [ngClass]="{'text-primary-900': selectedIndex === i, 'text-gray-700': selectedIndex !== i}">
              {{ shortcut.name }}
            </span>

            <kbd
              class="px-2 py-1 text-xs font-bold bg-white border border-gray-300 rounded shadow-sm font-mono text-gray-700 whitespace-nowrap">
              {{ shortcut.key }}
            </kbd>

          </div>
        }

        @if (displayShortcuts.length === 0) {
          <div class="text-center py-10 text-gray-400">
            <i class="pi pi-bolt text-4xl mb-2 opacity-50"></i>
            <p>No shortcuts found</p>
          </div>
        }
      </div>
    }
  </p-card>

  <div class="mt-3 flex justify-between text-xs text-gray-400 px-2 select-none">
    <div class="flex gap-1">
      <kbd class="font-mono bg-gray-200 px-1.5 py-0.5 rounded text-gray-600 border border-gray-300">↑↓</kbd>
      <span>to navigate</span>
    </div>
    <div class="flex gap-1">
      <kbd class="font-mono bg-gray-200 px-1.5 py-0.5 rounded text-gray-600 border border-gray-300">Enter</kbd>
      <span>to select</span>
    </div>
  </div>

</div>
