<div class="min-h-screen bg-gray-100">
  <header class="bg-white shadow-md px-6 py-4">
    <h1 class="text-2xl font-bold text-gray-800">{{ title }}</h1>
  </header>
  
  <main class="p-6 max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow-sm p-6">
      <h2 class="text-xl font-semibold mb-6 text-gray-700">Keyboard Shortcuts Settings</h2>
      
      <div class="space-y-4">
        <div class="p-4 bg-amber-50 rounded-md">
          <p class="text-sm text-amber-700">
            <i class="pi pi-info-circle mr-2"></i>
            <strong>Alt + F1:</strong> Show/Hide this window
          </p>
        </div>

        <div class="p-4 bg-amber-50 rounded-md">
          <p class="text-sm text-amber-700">
            <i class="pi pi-info-circle mr-2"></i>
            <strong>Alt + F2:</strong> Show toast notification (Console: 2)
          </p>
        </div>

        <div class="p-4 bg-amber-50 rounded-md">
          <p class="text-sm text-amber-700">
            <i class="pi pi-info-circle mr-2"></i>
            <strong>Alt + F3:</strong> Show toast notification (Console: 3)
          </p>
        </div>

        <div class="flex items-center space-x-3">
          <p-checkbox
            [(ngModel)]="shortcut4Enabled"
            [binary]="true"
            inputId="shortcut4"
            (onChange)="onShortcut4Change($event)">
          </p-checkbox>
          <label for="shortcut4" class="text-gray-700 font-medium">
            Alt + F4 Shortcut (Console: 4)
          </label>
        </div>
      </div>
      
      <div class="mt-6 p-4 bg-blue-50 rounded-md">
        <p class="text-sm text-blue-700">
          <i class="pi pi-info-circle mr-2"></i>
          Enable shortcuts to activate global keyboard commands. Check console for output.
        </p>
      </div>
    </div>
  </main>
</div>

<router-outlet />
