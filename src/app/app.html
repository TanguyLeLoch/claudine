<div class="min-h-screen bg-gray-100">
  <header class="bg-white shadow-md px-6 py-4">
    <h1 class="text-2xl font-bold text-gray-800">{{ title }}</h1>
  </header>
  <p-button class="p-4">bonjour</p-button>
  <button pButton>
    <i class="pi pi-check" pButtonIcon></i>
    <span pButtonLabel>Save</span>
  </button>
  <main class="p-6 max-w-4xl mx-auto">
    <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
      <h2 class="text-xl font-semibold mb-4 text-gray-700">Welcome to Claudine!</h2>
      <p class="text-gray-600 mb-4">Your Electron + Angular app with PrimeNG & Tailwind is ready!</p>
      
      <!-- Test PrimeNG + Tailwind integration -->
      <div class="space-y-4">
        <p-button 
          label="Test PrimeNG Button" 
          icon="pi pi-check"
          class="mr-2">
        </p-button>
        
        <p-button 
          label="Secondary" 
          severity="secondary"
          icon="pi pi-user"
          class="mr-2">
        </p-button>
        
        <div class="mt-4">
          <p-card header="Sample Card" class="max-w-md">
            <p class="text-gray-600">This card demonstrates PrimeNG components styled with Tailwind utilities.</p>
            <ng-template pTemplate="footer">
              <div class="flex gap-2">
                <p-button label="Save" size="small"></p-button>
                <p-button label="Cancel" severity="secondary" size="small"></p-button>
              </div>
            </ng-template>
          </p-card>
        </div>
      </div>
    </div>
  </main>
</div>

<router-outlet />
