<div class="min-h-screen bg-gray-100">
  <header class="bg-white shadow-md px-6 py-4">
    <h1 class="text-2xl font-bold text-gray-800">{{ title }}</h1>
  </header>

  <main class="p-6 max-w-2xl mx-auto">
    <!-- Info Message -->
    <p-message
      severity="info"
      text="Configure your AI provider settings. The API key will be stored securely on your device."
      styleClass="mb-4 w-full">
    </p-message>

    <!-- Settings Form -->
    <p-card header="Settings" styleClass="mb-4">
      <div class="space-y-6">
        <!-- Provider Selection -->
        <div class="flex flex-col gap-2">
          <label for="provider" class="font-semibold text-gray-700">AI Provider</label>
          <p-select
            inputId="provider"
            [(ngModel)]="selectedProvider"
            [options]="providers"
            optionLabel="label"
            placeholder="Select a provider"
            styleClass="w-full">
          </p-select>
        </div>

        <!-- API Key Input -->
        <div class="flex flex-col gap-2">
          <label for="apiKey" class="font-semibold text-gray-700">API Key</label>
          <input
            pInputText
            id="apiKey"
            type="password"
            [(ngModel)]="apiKey"
            placeholder="Enter your API key"
            class="w-full" />
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-3 mt-6">
          <p-button
            label="Save Settings"
            icon="pi pi-check"
            (onClick)="onSave()"
            styleClass="flex-1">
          </p-button>
          <p-button
            label="Cancel"
            icon="pi pi-times"
            severity="secondary"
            (onClick)="onCancel()">
          </p-button>
        </div>
      </div>
    </p-card>

    <!-- Keyboard Shortcuts -->
    <p-card header="Keyboard Shortcuts">
      <ul class="space-y-3">
        @for (shortcut of shortcuts; track shortcut.key) {
          <li class="flex items-center gap-3">
            <kbd class="bg-gray-100 px-3 py-1.5 rounded border border-gray-300 font-mono text-sm">
              {{ shortcut.key }}
            </kbd>
            <span class="text-gray-700">{{ shortcut.description }}</span>
          </li>
        }
      </ul>
    </p-card>
  </main>
</div>

<router-outlet />
