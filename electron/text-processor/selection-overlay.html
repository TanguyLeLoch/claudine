<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
      * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
      }
      body {
          width: 100vw;
          height: 100vh;
          cursor: crosshair;
          background: rgba(0, 0, 0, 0.3);
          overflow: hidden;
      }
      #selection {
          position: absolute;
          border: 2px solid #4CAF50;
          background: rgba(76, 175, 80, 0.1);
          display: none;
          pointer-events: none;
      }
      #instruction {
          position: absolute;
          top: 20px;
          left: 50%;
          transform: translateX(-50%);
          background: rgba(0, 0, 0, 0.8);
          color: white;
          padding: 12px 24px;
          border-radius: 8px;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          font-size: 14px;
          pointer-events: none;
          z-index: 1000;
      }
  </style>
</head>
<body>
<div id="instruction">Click and drag to select area • Press ESC to cancel</div>
<div id="selection"></div>
<script>
    const selection = document.getElementById('selection');
    let startX = 0, startY = 0;
    let isDrawing = false;
    let displayInfo = null;

    // Receive display bounds from main process
    window.electronAPI.onDisplayBounds((bounds) => {
        displayInfo = bounds;
        console.log('Display info received:', bounds);
    });

    document.addEventListener('mousedown', (e) => {
        isDrawing = true;
        startX = e.clientX;
        startY = e.clientY;
        selection.style.left = startX + 'px';
        selection.style.top = startY + 'px';
        selection.style.width = '0px';
        selection.style.height = '0px';
        selection.style.display = 'block';
    });

    document.addEventListener('mousemove', (e) => {
        if (!isDrawing) return;
        const currentX = e.clientX;
        const currentY = e.clientY;
        const width = Math.abs(currentX - startX);
        const height = Math.abs(currentY - startY);
        const left = Math.min(currentX, startX);
        const top = Math.min(currentY, startY);

        selection.style.left = left + 'px';
        selection.style.top = top + 'px';
        selection.style.width = width + 'px';
        selection.style.height = height + 'px';
    });

    document.addEventListener('mouseup', (e) => {
        if (!isDrawing) return;
        isDrawing = false;
        const currentX = e.clientX;
        const currentY = e.clientY;
        const width = Math.abs(currentX - startX);
        const height = Math.abs(currentY - startY);
        const left = Math.min(currentX, startX);
        const top = Math.min(currentY, startY);

        // Send selection via IPC with display ID
        // Coordinates are already relative to this window (which is positioned at the display's bounds)
        window.electronAPI.sendSelection({
            x: left,
            y: top,
            width,
            height,
            displayId: displayInfo ? displayInfo.id : 0
        });
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            // Cancel selection via IPC
            window.electronAPI.cancelSelection();
        }
    });
</script>
</body>
</html>
